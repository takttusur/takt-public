name: [develop] Test, build and deploy to GH Pages, also publish image
on:
  push:
    branches:
      - 'develop'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false
  
env:
  BASE_URL: ${{ vars.BASE_URL }}
  YANDEX_METRIKA_ENABLED: ${{ vars.YANDEX_METRIKA_ENABLED }}
  YANDEX_METRIKA_ID: ${{ vars.YANDEX_METRIKA_ID }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install deps
        run: npm ci
      - name: Create env file
        run: |
            touch .env.local
            echo VITE_YANDEX_METRIKA_ENABLED=$YANDEX_METRIKA_ENABLED >> .env.local
            echo VITE_YANDEX_METRIKA_ID=$YANDEX_METRIKA_ID >> .env.local
            cat .env.local  
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build:dev -- --base=$BASE_URL
      - name: Archive artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          name: takttusur-develop-dev
          path: dist 
          retention-days: 15
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: 
      - build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: takttusur-develop-dev
  publish:
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == format('refs/heads/{0}', 'develop') }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: "linux/arm64,linux/amd64"
