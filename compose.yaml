services:
  webapi:
    build:
      context: .
      dockerfile: src/Takt.Services.WebApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    expose:
      - "8080"

  frontend:
    build:
      context: .
      dockerfile: src/takt-spa/Dockerfile.dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: http://webapi:8080
      VITE_HMR_CLIENT_PORT: "8080"
      VITE_HMR_HOST: localhost
    volumes:
      - ./src/takt-spa:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "5173"
    depends_on:
      - webapi

  proxy:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - webapi
      - frontend

volumes:
  frontend_node_modules:
